# Production stack for firesight.codewheel.ca. HTTPS is handled by the shared
# Caddy in the codewheel repo; Postgres stays on this project's private network.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # The codewheel Caddyfile reaches the app by this name. Rename both together.
    container_name: firesight-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FiresightDatabase: "Host=postgres;Port=5432;Database=firesight;Username=firesight;Password=${POSTGRES_PASSWORD}"
      Claude__ApiKey: ${CLAUDE_API_KEY}
    depends_on:
      - postgres
    networks:
      - default
      - codewheel

  postgres:
    image: postgis/postgis:16-3.4
    container_name: firesight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: firesight
      POSTGRES_USER: firesight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - firesight-postgres-data:/var/lib/postgresql/data

networks:
  # Created once on the server with `docker network create codewheel`.
  codewheel:
    external: true

volumes:
  firesight-postgres-data:
