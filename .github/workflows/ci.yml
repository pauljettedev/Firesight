name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Firesight.slnx

      - name: Build
        run: dotnet build Firesight.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Firesight.slnx --configuration Release --no-build

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Firesight.Web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Firesight.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    # Skips cleanly (rather than failing) until DEPLOY_HOST etc. are set up in
    # the repo's Actions secrets — see docs/deployment.md.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time. A second push waits for the first deploy to finish
    # instead of running against the same server folder at the same time.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Stop at the first failing command, so a failed build fails the
            # deploy instead of being hidden by the cleanup step after it.
            set -e
            cd Firesight
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            # Each build leaves the previous image behind. Remove images no
            # container uses so they don't fill the droplet's disk.
            docker image prune -f
