  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Firesight: live map of Canadian wildfires</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://firesight.codewheel.ca/" />

      property="og:description"
      content="A live map of active Canadian wildfires, synced hourly from CWFIS. Search near a place, or ask questions in plain English."

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Firesight map of active wildfires across Canada, coloured by status"
